name: billing_app
description: CASCO Accessories - Billing and Invoice Management
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.2

  # PDF & Printing
  pdf: ^3.11.0
  printing: ^5.13.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1

  # Excel Export
  excel: ^2.1.0

  # File Picker
  file_picker: ^8.0.0+1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  # Add assets
  assets:
    - assets/images/
